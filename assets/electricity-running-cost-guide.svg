<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Electricity running cost calculation guide</title>
<desc id="desc">A four-step guide showing appliance wattage converted to kilowatts, multiplied by hours used and days per week to estimate energy use, then multiplied by the electricity tariff to estimate daily, weekly, monthly and annual cost.</desc>
<rect width="900" height="360" rx="24" fill="#f8fafc"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#111827">
<text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700">From appliance wattage to running cost</text>
<text x="450" y="70" text-anchor="middle" font-size="16" fill="#4b5563">Use the wattage label on the appliance and your actual electricity tariff</text>
<g>
<rect x="35" y="120" width="190" height="150" rx="18" fill="#ffffff" stroke="#d1d5db"/>
<text x="130" y="153" text-anchor="middle" font-size="18" font-weight="700">1. Power</text>
<text x="130" y="190" text-anchor="middle" font-size="15">Watts ÷ 1000</text>
<text x="130" y="225" text-anchor="middle" font-size="15" font-weight="700">= Kilowatts</text>
</g>
<g>
<rect x="250" y="120" width="190" height="150" rx="18" fill="#ffffff" stroke="#d1d5db"/>
<text x="345" y="153" text-anchor="middle" font-size="18" font-weight="700">2. Usage</text>
<text x="345" y="188" text-anchor="middle" font-size="15">kW × hours/day</text>
<text x="345" y="211" text-anchor="middle" font-size="15">× days/week ÷ 7</text>
<text x="345" y="246" text-anchor="middle" font-size="15" font-weight="700">= kWh per day</text>
</g>
<g>
<rect x="465" y="120" width="190" height="150" rx="18" fill="#ffffff" stroke="#d1d5db"/>
<text x="560" y="153" text-anchor="middle" font-size="18" font-weight="700">3. Tariff</text>
<text x="560" y="190" text-anchor="middle" font-size="15">kWh/day ×</text>
<text x="560" y="213" text-anchor="middle" font-size="15">rate in $/kWh</text>
<text x="560" y="246" text-anchor="middle" font-size="15" font-weight="700">= Daily cost</text>
</g>
<g>
<rect x="680" y="120" width="185" height="150" rx="18" fill="#ffffff" stroke="#d1d5db"/>
<text x="772.5" y="153" text-anchor="middle" font-size="18" font-weight="700">4. Compare</text>
<text x="772.5" y="188" text-anchor="middle" font-size="15">Daily → weekly</text>
<text x="772.5" y="211" text-anchor="middle" font-size="15">→ monthly → yearly</text>
<text x="772.5" y="246" text-anchor="middle" font-size="15" font-weight="700">See the long-term cost</text>
</g>
<g fill="#6b7280" font-size="30" font-weight="700">
<text x="237" y="205" text-anchor="middle">→</text>
<text x="452" y="205" text-anchor="middle">→</text>
<text x="667" y="205" text-anchor="middle">→</text>
</g>
<text x="450" y="320" text-anchor="middle" font-size="15" fill="#4b5563">Tip: use the tariff from your latest bill rather than a generic average when accuracy matters.</text>
</g>
</svg>
