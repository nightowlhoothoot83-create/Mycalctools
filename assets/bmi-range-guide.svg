<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">BMI range guide</title>
  <desc id="desc">A visual guide showing the standard adult BMI categories: underweight below 18.5, healthy weight 18.5 to 24.9, overweight 25 to 29.9, and obesity 30 and above. It also notes that BMI is a screening measure and does not account for muscle mass, age, pregnancy, or individual health factors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1324"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="464" rx="22" fill="none" stroke="#26324b" stroke-width="2"/>
  <text x="70" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">Understanding your BMI result</text>
  <text x="70" y="132" fill="#aeb8cc" font-family="Arial, sans-serif" font-size="20">Standard adult screening ranges</text>

  <g transform="translate(70 185)">
    <rect x="0" y="0" width="245" height="150" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="24" y="45" fill="#93c5fd" font-family="Arial, sans-serif" font-size="24" font-weight="700">Underweight</text>
    <text x="24" y="94" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">&lt; 18.5</text>
    <text x="24" y="128" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="18">BMI</text>

    <rect x="270" y="0" width="245" height="150" rx="20" fill="#062d28" stroke="#34d399" stroke-width="2"/>
    <text x="294" y="45" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="24" font-weight="700">Healthy weight</text>
    <text x="294" y="94" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">18.5–24.9</text>
    <text x="294" y="128" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="18">BMI</text>

    <rect x="540" y="0" width="245" height="150" rx="20" fill="#3a2b06" stroke="#fbbf24" stroke-width="2"/>
    <text x="564" y="45" fill="#fde68a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Overweight</text>
    <text x="564" y="94" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">25–29.9</text>
    <text x="564" y="128" fill="#fef3c7" font-family="Arial, sans-serif" font-size="18">BMI</text>

    <rect x="810" y="0" width="245" height="150" rx="20" fill="#3a1730" stroke="#f472b6" stroke-width="2"/>
    <text x="834" y="45" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="24" font-weight="700">Obesity</text>
    <text x="834" y="94" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">30+</text>
    <text x="834" y="128" fill="#fbcfe8" font-family="Arial, sans-serif" font-size="18">BMI</text>
  </g>

  <rect x="70" y="372" width="1055" height="78" rx="16" fill="#0b1220" stroke="#26324b"/>
  <text x="96" y="405" fill="#dbeafe" font-family="Arial, sans-serif" font-size="19" font-weight="700">BMI is a screening tool, not a diagnosis.</text>
  <text x="96" y="434" fill="#aeb8cc" font-family="Arial, sans-serif" font-size="17">It does not account for muscle mass, pregnancy, age, ethnicity, or your individual health history.</text>
</svg>