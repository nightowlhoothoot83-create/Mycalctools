<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Generator versus solar five-year cost comparison</title>
  <desc id="desc">A worked example showing generator fuel and maintenance costs compared with a solar and battery installation over five years.</desc>
  <rect width="1200" height="675" rx="28" fill="#0f172a"/>
  <text x="60" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Where the five-year cost comes from</text>
  <text x="60" y="116" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Worked example using the calculator defaults</text>

  <rect x="60" y="165" width="500" height="390" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="95" y="215" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Generator</text>
  <text x="95" y="262" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22">1.2 L/hour × 5 hours/day</text>
  <text x="95" y="302" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22">× $2/L = $12/day</text>
  <line x1="95" y1="330" x2="525" y2="330" stroke="#475569" stroke-width="2"/>
  <text x="95" y="378" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="21">Fuel over 5 years</text>
  <text x="525" y="378" fill="#f8fafc" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="700">$21,900</text>
  <text x="95" y="425" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="21">Maintenance: $500/year</text>
  <text x="525" y="425" fill="#f8fafc" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="700">$2,500</text>
  <line x1="95" y1="452" x2="525" y2="452" stroke="#64748b" stroke-width="2"/>
  <text x="95" y="505" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">5-year generator total</text>
  <text x="525" y="505" fill="#f8fafc" text-anchor="end" font-family="Arial, sans-serif" font-size="30" font-weight="700">$24,400</text>

  <rect x="640" y="165" width="500" height="390" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="675" y="215" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Solar + battery</text>
  <text x="675" y="262" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22">Installed system cost</text>
  <text x="1105" y="262" fill="#f8fafc" text-anchor="end" font-family="Arial, sans-serif" font-size="28" font-weight="700">$12,000</text>
  <line x1="675" y1="292" x2="1105" y2="292" stroke="#475569" stroke-width="2"/>
  <text x="675" y="345" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="21">Simple comparison saving</text>
  <text x="1105" y="345" fill="#f8fafc" text-anchor="end" font-family="Arial, sans-serif" font-size="28" font-weight="700">$12,400</text>
  <text x="675" y="402" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Before finance, solar servicing,</text>
  <text x="675" y="432" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">battery replacement or weather effects.</text>
  <rect x="675" y="472" width="430" height="52" rx="12" fill="#1e293b"/>
  <text x="890" y="506" fill="#e2e8f0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">Compare like-for-like energy capacity</text>

  <text x="60" y="615" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Tip: use measured generator fuel consumption and a complete solar quote that can support the same daily energy and peak loads.</text>
</svg>
