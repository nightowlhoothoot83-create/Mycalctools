name: Fix MyCalc mobile image delivery
on:
  push:
    branches:
      - repair/mobile-image-performance-20260830
  workflow_dispatch:
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace heavyweight image references
        run: python scripts/fix_mobile_images.py
      - name: Commit generated image fixes
        run: |
          if git diff --quiet; then
            echo "No image changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git commit -m "Optimize MyCalc mobile image delivery"
          git push
