name: Apply Raven Sharp hub link fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-raven-hub-link.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route shared Raven Sharp Tools link to suite hub
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          old='https://pod.raven-sharp.com/login'
          if old not in s:
              raise SystemExit('Old Raven Sharp Tools destination not found; refusing blind patch')
          p.write_text(s.replace(old,'https://raven-sharp.com'),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "fix: route Raven Sharp Tools to suite hub"
          git push
