name: Fix MyCalc footer logo presentation
on:
  push:
    branches: [repair/mycalc-footer-logo-20260830]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mycalc-footer-logo-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_footer_logo_presentation.py
      - name: Commit targeted footer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Match MyCalc Ascension footer logo to Calendar presentation"
          git push
