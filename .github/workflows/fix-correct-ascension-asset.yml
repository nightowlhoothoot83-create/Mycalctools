name: Fix correct Ascension asset
on:
  push:
    branches: [repair/mycalc-correct-ascension-asset-20260830]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mycalc-correct-ascension-asset-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_correct_ascension_asset.py
      - name: Commit exact asset fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use exact current Calendar Ascension footer asset"
          git push
