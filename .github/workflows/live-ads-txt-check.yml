name: Live ads.txt check
on:
  push:
    branches: [ops/ads-txt-live-check-20260917]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check all AdSense ads.txt endpoints
        shell: bash
        run: |
          set -u
          for url in \
            https://mycalctools.net/ads.txt \
            https://mycalendartools.net/ads.txt \
            https://wheelnamepicker.com.au/ads.txt
          do
            echo "===== $url ====="
            body="$(mktemp)"
            curl -sS -L --max-time 20 -o "$body" -w 'HTTP=%{http_code} FINAL=%{url_effective} TYPE=%{content_type}\n' "$url" || true
            echo "BODY:"
            cat "$body" 2>/dev/null || true
            echo
            if grep -Fq 'google.com, pub-1904958390525375, DIRECT, f08c47fec0942fa0' "$body"; then
              echo 'PUBLISHER_LINE=OK'
            else
              echo 'PUBLISHER_LINE=MISSING'
            fi
            echo
          done
      - name: Count live homepage words using monitor-style stripping
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          for url in ['https://mycalctools.net/','https://mycalendartools.net/','https://wheelnamepicker.com.au/']:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  html=r.read().decode('utf-8','ignore')
                  status=r.status
              text=re.sub(r'<script[\s\S]*?</script>', ' ', html, flags=re.I)
              text=re.sub(r'<style[\s\S]*?</style>', ' ', text, flags=re.I)
              text=re.sub(r'<[^>]+>', ' ', text)
              words=re.findall(r'\S+', text)
              print(f'{url} HTTP={status} WORDS={len(words)} THIN_MONITOR={len(words)<300}')
          PY
