name: Final image performance optimizer

on:
  push:
    branches: [codex/recover-mycalc-final]
    paths:
      - .github/workflows/final-image-performance-fix.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recover-mycalc-final
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build display-sized WebP assets and patch shared markup
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          out = root / 'assets' / 'perf'
          out.mkdir(parents=True, exist_ok=True)

          # Maximum pixel size is deliberately 2x or more than the largest
          # approved on-page display so appearance remains unchanged on HiDPI.
          specs = {
              'owl-raven.png': 1200,
              'wheelnamepicker-logo.png': 240,
              'zyia-creations.png': 240,
              'adg-downloads.png': 240,
              'spew-crew.png': 240,
              'mystical-moments.png': 240,
              'mycalctools-logo.png': 360,
              'mycalendartools-logo.png': 240,
              'raven-sharp.jpg': 160,
              'ravensharp-logo.jpg': 240,
              'feed-the-feed.jpg': 240,
              'ascension-digital-logo.jpg': 720,
              'ventraip-affiliate-banner.jpg': 1200,
          }

          created = {}
          for source_name, max_dim in specs.items():
              source = root / source_name
              if not source.exists():
                  continue
              with Image.open(source) as im:
                  im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  if max(im.size) > max_dim:
                      scale = max_dim / max(im.size)
                      im = im.resize((max(1, round(im.width*scale)), max(1, round(im.height*scale))), Image.Resampling.LANCZOS)
                  target = out / (source.stem + '.webp')
                  im.save(target, 'WEBP', quality=88, method=6)
                  created[source_name] = '/' + target.as_posix()

          script_path = root / 'script.js'
          script = script_path.read_text(encoding='utf-8')

          # Patch only the group-footer block so nav/hero assets retain their
          # existing source unless they have their own explicit rule below.
          start = script.find('function renderGroupFooter()')
          end = script.find('function renderAdLeaderboard', start)
          if start != -1 and end != -1:
              block = script[start:end]
              for old, new in created.items():
                  block = block.replace('/' + old, new)
              block = re.sub(r'<img([^>]*class="rs-footer-brand-icon"[^>]*)>',
                             lambda m: '<img' + m.group(1) + (' loading="lazy"' if 'loading=' not in m.group(1) else '') + (' decoding="async"' if 'decoding=' not in m.group(1) else '') + ' width="52" height="52">', block)
              block = re.sub(r'<img([^>]*class="ascension-logo"[^>]*)>',
                             lambda m: '<img' + m.group(1) + (' loading="lazy"' if 'loading=' not in m.group(1) else '') + (' decoding="async"' if 'decoding=' not in m.group(1) else '') + ' width="315" height="129">', block)
              script = script[:start] + block + script[end:]

          # Tiny top Raven mark is above the fold, so optimize but do not lazy-load.
          if 'raven-sharp.jpg' in created:
              marker_start = script.find('function renderBrandStrip()')
              marker_end = script.find('function renderNav()', marker_start)
              if marker_start != -1 and marker_end != -1:
                  block = script[marker_start:marker_end].replace('/raven-sharp.jpg', created['raven-sharp.jpg'])
                  block = block.replace('<img src="' + created['raven-sharp.jpg'] + '" alt="Raven Sharp"', '<img src="' + created['raven-sharp.jpg'] + '" alt="Raven Sharp" width="32" height="32" decoding="async"')
                  script = script[:marker_start] + block + script[marker_end:]

          # Footer/site logo can be lazy; nav logo remains eager.
          script = script.replace('<img src="/mycalctools-logo.png" alt="MyCalcTools logo" class="nav-logo-icon">\n          <span class="nav-logo-text">MyCalcTools</span>\n            </a>\n            <p>Free online calculators',
                                  '<img src="' + created.get('mycalctools-logo.png','/mycalctools-logo.png') + '" alt="MyCalcTools logo" class="nav-logo-icon" width="36" height="36" loading="lazy" decoding="async">\n          <span class="nav-logo-text">MyCalcTools</span>\n            </a>\n            <p>Free online calculators')
          script_path.write_text(script, encoding='utf-8')

          index_path = root / 'index.html'
          html = index_path.read_text(encoding='utf-8')
          # Large story/affiliate images are below the initial hero. Use the
          # display variants and reserve dimensions so they no longer compete
          # with first contentful paint.
          for old in ('owl-raven.png','ventraip-affiliate-banner.jpg'):
              if old in created:
                  html = html.replace('src="/' + old + '"', 'src="' + created[old] + '"')
          html = re.sub(r'<img([^>]*src="/assets/perf/owl-raven\.webp"[^>]*)>', lambda m: '<img'+m.group(1)+' loading="lazy" decoding="async">' if 'loading=' not in m.group(1) else m.group(0), html)
          html = re.sub(r'<a href="mailto:emma@ascensiondigitalgroup\.com">', '<a href="mailto:emma@ascensiondigitalgroup.com" style="text-decoration:underline;text-underline-offset:2px">', html)
          index_path.write_text(html, encoding='utf-8')

          # Add intrinsic sizing/lazy loading to the shared affiliate banner.
          script = script_path.read_text(encoding='utf-8')
          if 'ventraip-affiliate-banner.jpg' in created:
              script = script.replace('src="/ventraip-affiliate-banner.jpg" alt="VentraIP Australian website hosting affiliate banner"',
                                      'src="' + created['ventraip-affiliate-banner.jpg'] + '" alt="VentraIP Australian website hosting affiliate banner" width="770" height="513" loading="lazy" decoding="async"')
          # Footer column headings should follow the page h2 hierarchy instead of
          # skipping directly to h4, which Lighthouse flagged on the homepage.
          footer_start = script.find('function renderFooter()')
          footer_end = script.find('function renderGroupFooter()', footer_start)
          if footer_start != -1 and footer_end != -1:
              block = script[footer_start:footer_end].replace('<h4>', '<h3>').replace('</h4>', '</h3>')
              script = script[:footer_start] + block + script[footer_end:]
          script_path.write_text(script, encoding='utf-8')

      - name: Commit optimized assets and markup
        run: |
          git config user.name "adg-final-readiness"
          git config user.email "actions@users.noreply.github.com"
          git add assets/perf script.js index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Optimize MyCalc image delivery and accessibility"
            git push origin HEAD:codex/recover-mycalc-final
          fi
