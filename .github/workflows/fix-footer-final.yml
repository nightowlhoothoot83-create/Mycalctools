name: Fix final MyCalc footer
on:
  push:
    branches: [repair/mycalc-footer-final-20260830]
    paths:
      - scripts/fix_footer_final.py
      - .github/workflows/fix-footer-final.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mycalc-footer-final-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_footer_final.py
      - name: Verify exact footer markup
        run: |
          grep -F 'raw.githubusercontent.com/nightowlhoothoot83-create/Mycalendartools/main/assets/perf/ascension-digital.webp?rev=20260830c' script.js
          grep -F 'style="width:280px;max-width:78vw;' script.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          if ! git diff --cached --quiet; then
            git commit -m 'Use exact current Ascension footer artwork'
            git push
          fi
