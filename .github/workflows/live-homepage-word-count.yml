name: Live homepage word count
on:
  push:
    branches: [ops/ads-txt-live-check-20260917]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count visible-ish homepage words
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import re, urllib.request
          for url in [
              'https://mycalctools.net/',
              'https://mycalendartools.net/',
              'https://wheelnamepicker.com.au/',
          ]:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  html=r.read().decode('utf-8','ignore')
                  status=r.status
                  final=r.geturl()
                  ctype=r.headers.get('content-type')
              text=re.sub(r'<script[\s\S]*?</script>', ' ', html, flags=re.I)
              text=re.sub(r'<style[\s\S]*?</style>', ' ', text, flags=re.I)
              text=re.sub(r'<[^>]+>', ' ', text)
              words=re.findall(r'\b\w+\b', text)
              print(f'{url} HTTP={status} FINAL={final} TYPE={ctype} WORDS={len(words)}')
          PY
