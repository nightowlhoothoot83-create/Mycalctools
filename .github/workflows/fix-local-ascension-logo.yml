name: Fix local Ascension logo
on:
  push:
    branches: [repair/mycalc-local-ascension-logo-20260830]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mycalc-local-ascension-logo-20260830
      - name: Copy approved Ascension asset locally
        run: |
          mkdir -p assets/perf
          curl -fL --retry 3 "https://raw.githubusercontent.com/nightowlhoothoot83-create/Mycalendartools/main/assets/perf/ascension-digital.webp" -o assets/perf/ascension-digital-current.webp
          test -s assets/perf/ascension-digital-current.webp
      - name: Point footer at local asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          import re
          s,n=re.subn(r'https://(?:www\.)?mycalendartools\.net/assets/perf/ascension-digital\.webp(?:\?v=\d+)?', '/assets/perf/ascension-digital-current.webp?v=20260830b', s)
          if n < 1:
              raise SystemExit('Ascension footer URL not found')
          p.write_text(s, encoding='utf-8')
          out=p.read_text(encoding='utf-8')
          assert '/assets/perf/ascension-digital-current.webp?v=20260830b' in out
          assert 'mycalendartools.net/assets/perf/ascension-digital.webp' not in out
          PY
      - name: Commit local logo repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/perf/ascension-digital-current.webp script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use local approved Ascension footer logo"
          git push