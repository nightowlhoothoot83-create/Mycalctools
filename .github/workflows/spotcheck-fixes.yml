name: Final spot-check fixes
on:
  push:
    branches:
      - repair/final-adsense-content-20260916
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply spot-check fixes
        run: python scripts/spotcheck_fixes.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js sitemap.html concrete-calculator.html
          git commit -m "Apply final spot-check fixes"
          git push
